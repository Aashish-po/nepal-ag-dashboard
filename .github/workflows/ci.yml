name: CI

permissions:
  contents: read
  actions: read

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install pip-audit

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: bandit -r backend -ll
      - run: pip-audit
      - run: pytest --cov=backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm lint
      - run: cd frontend && pnpm tsc --noEmit
      - run: cd frontend && pnpm test --run
      - run: cd frontend && pnpm build

  create_issue:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: failure()
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub issue on failure
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo.repository;
            const owner = context.repo.owner;
            const runUrl = context.repo.html_url + "/actions/runs/" + context.runId;

            const failedJobs = [];
            if (context.payload.jobs) {
              for (const [name, job] of Object.entries(context.payload.jobs)) {
                if (job.conclusion === 'failure') {
                  failedJobs.push(name);
                }
              }
            }

            const title = `CI failure: ${failedJobs.join(', ')}`;
            const body = `## CI Failure Report

            **Workflow:** ${context.workflow}
            **Branch:** ${context.payload.ref}
            **Commit:** ${context.payload.head_commit.id}
            **Failed jobs:** ${failedJobs.join(', ') || 'unknown'}

            **Run URL:** ${runUrl}

            ### Steps to reproduce
            1. Check the run logs linked above
            2. Identify failing job and step
            3. Fix and push a new commit`;

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['ci-failure', 'bug']
            });
